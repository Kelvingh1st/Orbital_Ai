name: Build Orbital AI Frontend

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Orbital AI Frontend
        working-directory: tools/ui
        run: |
          npm ci
          npm run build

      - name: Package Frontend Artifact
        run: |
          mkdir -p output/ui-build
          cp -r tools/ui/dist/* output/ui-build/ || cp -r tools/ui/build/* output/ui-build/ || true

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbital-frontend-build
          path: output/
