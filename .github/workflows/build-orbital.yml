name: Build Orbital AI for Android

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Orbital AI Frontend
        working-directory: tools/ui
        run: |
          npm ci
          npm run build

      - name: Install Android NDK & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Compile llama-server for Android ARM64
        run: |
          cd bin/source/llama.cpp
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DGGML_VULKAN=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF
          cmake --build build --config Release -j$(nproc)

      - name: Package Artifacts
        run: |
          mkdir -p output/bin
          cp bin/source/llama.cpp/build/bin/llama-server output/bin/orbital-server
          cp -r tools/ui/build output/ui-build || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbital-android-arm64
          path: output/
